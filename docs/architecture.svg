<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">RelayDesk service architecture</title><desc id="desc">Signed webhooks and a TypeScript dashboard reach a Go API. C++ validates totals. PostgREST RPCs persist state in PostgreSQL. A Go worker delivers orders to an idempotent fulfillment simulator.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#9b91bb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="700" rx="18" fill="#172432"/>
<text x="55" y="60" font-family="sans-serif" font-size="13" letter-spacing="3" fill="#a99ae3">GO · TYPESCRIPT · C++20 · POSTGRESQL</text>
<text x="52" y="117" font-family="sans-serif" font-size="44" font-weight="700" fill="#f2f3f8">RelayDesk</text>
<text x="55" y="153" font-family="sans-serif" font-size="17" fill="#9dacbc">Durable order synchronization, with the failure paths made visible.</text>
<g stroke="#9b91bb" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M300 255 H435"/><path d="M300 430 H365 V275 H435"/>
<path d="M665 255 H800"/><path d="M550 300 V385"/>
